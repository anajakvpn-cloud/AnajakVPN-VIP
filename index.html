<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0a14">
  <meta name="description" content="AnajakVIP website has closed. Contact us on Telegram or visit our new website.">
  <title>AnajakVIP — វេបសាយត្រូវបានបិទ</title>
  <link rel="icon" href="icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{color-scheme:dark;--bg:#090812;--panel:#151322;--muted:#a5a0b8;--purple:#9b75ff;--line:rgba(167,139,250,.2)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#29204b 0%,#100e1c 43%,var(--bg) 78%);color:#f8f7ff;font-family:'Noto Sans Khmer',Inter,system-ui,sans-serif}
    .wrap{width:min(100%,440px);text-align:center}
    .card{position:relative;overflow:hidden;padding:34px 25px 27px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(155deg,rgba(31,26,53,.97),rgba(16,14,27,.98));box-shadow:0 24px 80px #0008, inset 0 1px #ffffff0d}
    .card:before{content:"";position:absolute;width:230px;height:230px;top:-150px;left:calc(50% - 115px);background:#8b5cf6;filter:blur(80px);opacity:.3}
    .logo{position:relative;width:76px;height:76px;margin:0 auto 19px;display:grid;place-items:center;border-radius:24px;background:linear-gradient(145deg,#8b5cf6,#5426b8);box-shadow:0 12px 32px #6d28d966;font-size:31px}
    h1{position:relative;margin:0;font-size:25px;font-weight:800;letter-spacing:.2px}
    .tag{margin:8px 0 25px;color:#b7afd0;font:500 12px Inter,sans-serif;letter-spacing:2px;text-transform:uppercase}
    .notice{padding:19px 16px;margin-bottom:22px;border:1px solid rgba(248,113,113,.2);border-radius:18px;background:rgba(248,113,113,.055)}
    .notice-icon{color:#fb8585;font-size:21px;margin-bottom:10px}
    .notice h2{font-size:18px;line-height:1.65;margin:0 0 7px;color:#fff}
    .notice p{font-size:13px;line-height:1.9;color:#c4bfd1;margin:0}
    .actions{display:grid;gap:11px}
    a.btn{min-height:52px;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 18px;border-radius:15px;text-decoration:none;font-size:15px;font-weight:700;transition:transform .18s,filter .18s}
    a.btn:active{transform:scale(.98)}
    .contact{background:linear-gradient(135deg,#269bdc,#1674c5);color:white;box-shadow:0 8px 22px #1674c544}
    .buy{background:linear-gradient(135deg,#9b70ff,#6d3bd2);color:white;box-shadow:0 8px 22px #6d3bd244}
    .username{margin:15px 0 0;color:#938ca8;font-size:12px}
    .username strong{color:#d9ccff;font-family:Inter,sans-serif;font-weight:600}
    footer{margin-top:18px;color:#777189;font:11px Inter,sans-serif}
    @media(min-width:600px){.card{padding:40px 32px 30px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-labelledby="page-title">
      <div class="logo"><i class="fa-solid fa-shield-halved"></i></div>
      <h1 id="page-title">AnajakVIP</h1>
      <p class="tag">Official Website Notice</p>
      <div class="notice">
        <div class="notice-icon"><i class="fa-solid fa-circle-exclamation"></i></div>
        <h2>វេបសាយត្រូវបានបិទហើយ</h2>
        <p>សូមទំនាក់ទំនងមកកាន់យើងខ្ញុំតាម Telegram ប្រសិនបើលោកអ្នកត្រូវការជំនួយ។</p>
      </div>
      <div class="actions">
        <a class="btn contact" href="https://t.me/Kimheng22" target="_blank" rel="noopener noreferrer">
          <i class="fa-brands fa-telegram"></i> ទំនាក់ទំនង
        </a>
        <a class="btn buy" href="https://anajakvip.shop/" target="_blank" rel="noopener noreferrer">
          <i class="fa-solid fa-cart-shopping"></i> ទិញនៅវេបសាយថ្មី
        </a>
      </div>
      <p class="username">Telegram: <strong>@Kimheng22</strong></p>
    </section>
    <footer>© AnajakVIP · Thank you for your support</footer>
  </main>
</body>
</html>
